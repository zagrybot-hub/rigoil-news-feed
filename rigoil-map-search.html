<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
html,body{height:100%;width:100%;margin:0;padding:0;font-family:Arial,sans-serif;overflow:hidden}
#map{height:100%;width:100%}
.map-search{position:absolute;z-index:10;top:70px;left:12px;right:12px;max-width:520px}
.search-row{display:flex;gap:6px;background:rgba(255,255,255,.96);border:1px solid #b7c0c8;border-radius:6px;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.16)}
#platformSearch{flex:1;border:0;outline:0;font-size:14px;padding:8px;min-width:0;background:transparent}
#platformSearchButton{border:0;background:#111;color:#fff;border-radius:4px;padding:0 12px;font-size:13px;cursor:pointer}
.suggestions{margin-top:4px;background:#fff;border:1px solid #b7c0c8;border-radius:6px;max-height:300px;overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.suggestion{padding:9px 11px;cursor:pointer;font-size:13px;line-height:1.35;border-bottom:1px solid #eef1f3}
.suggestion:hover,.suggestion.active{background:#eef6ff}
.suggestion-title{font-weight:700;color:#111}
.suggestion-meta{color:#52606d;font-size:12px}
.search-status{margin-top:4px;display:inline-block;background:rgba(255,255,255,.92);color:#333;font-size:12px;padding:4px 7px;border-radius:4px}
.marker-label{position:absolute;transform:translate(-50%,-35px);background:white;padding:2px 5px;border-radius:3px;font-size:12px;color:black;border:1px solid #666;white-space:nowrap;pointer-events:none}
.info-window{max-width:200px}
.image-wrapper{width:100%;aspect-ratio:4/3;background:#e0e0e0;border-radius:4px;margin-top:6px;position:relative;overflow:hidden}
.image-wrapper span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#666}
.image-wrapper img{width:100%;height:100%;object-fit:cover;display:none}
.button-link{display:inline-block;margin-top:6px;padding:6px 12px;font-size:12px;font-weight:bold;color:#fff;background:#1a73e8;border-radius:4px;text-decoration:none;cursor:pointer;transition:background .2s}
.button-link:hover{background:#155ab6}
@media(max-width:640px){.map-search{top:70px;left:8px;right:8px;max-width:none}.suggestion{padding:12px;font-size:14px}}
</style>
<script src="https://maps.googleapis.com/maps/api/js?key=***
</head>
<body>
<div id="mapSearch" class="map-search"><div class="search-row"><input id="platformSearch" type="search" placeholder="Search platform, field, country, block..." autocomplete="off" /><button id="platformSearchButton" type="button">Search</button></div><div id="platformSuggestions" class="suggestions" hidden></div><div id="platformSearchStatus" class="search-status" aria-live="polite">Loading map...</div></div>
<div id="map"></div>
<script>
let map,infoWindow,markers=[],overlays=[],markerByKey={},searchIndex=[],activeSuggestionIndex=-1,currentSuggestions=[],searchWired=false,lastMapSignature='';
const MAP_DATA_URL='platform_map_data.json';
const grayStyle=[{elementType:'geometry',stylers:[{color:'#f5f5f5'}]},{elementType:'labels.icon',stylers:[{visibility:'off'}]},{elementType:'labels.text.fill',stylers:[{color:'#616161'}]},{elementType:'labels.text.stroke',stylers:[{color:'#f5f5f5'}]},{featureType:'water',elementType:'geometry',stylers:[{color:'#cbd5e1'}]}];

function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(v){return String(v||'').toLowerCase().trim()}
function arr(v){if(!v)return[];if(Array.isArray(v))return v.map(function(x){return typeof x==='string'?x:(x.name||x.title||x.slug||'')}).filter(Boolean);return String(v).split(/[|,;]+/).map(function(x){return x.trim()}).filter(Boolean)}
function keyFor(loc){return norm(loc.routeSlug||loc.slug||(loc.title+'-'+loc.lat+'-'+loc.lng))}

function openMarker(marker){
  var loc=marker.rigData||{};
  var img=loc.image?'<div class="image-wrapper"><span>Loading...</span><img loading="lazy" decoding="async" src="'+esc(loc.image)+'" onload="this.style.display=\'block\';this.previousElementSibling.style.display=\'none\'"></div>':'';
  var layout=loc.layout?'<div class="image-wrapper"><span>Loading...</span><img loading="lazy" decoding="async" src="'+esc(loc.layout)+'" onload="this.style.display=\'block\';this.previousElementSibling.style.display=\'none\'"></div>':'';
  var link=String(loc.link||'').trim();
  infoWindow.setContent('<div class="info-window"><strong>'+esc(loc.title)+'</strong>'+img+layout+'<a class="button-link" href="#" onclick="window.parent.postMessage({type:\'navigate\',url:\''+link+'\'},\'*\');return false">Details</a></div>');
  infoWindow.open(map,marker);
}

function buildSearch(locs){
  markerByKey={};searchIndex=[];
  markers.forEach(function(marker){
    var loc=marker.rigData||{},key=keyFor(loc);
    markerByKey[key]=marker;
    var fields=[loc.title,loc.operator,loc.field,loc.fieldGroup,loc.country,loc.block,loc.assetType,loc.slug,loc.routeSlug].concat(arr(loc.aliases),arr(loc.similar));
    searchIndex.push({key:key,marker:marker,loc:loc,text:norm(fields.join(' ')),title:norm(loc.title),aliases:arr(loc.aliases).map(norm),field:norm((loc.field||'')+' '+(loc.fieldGroup||'')),meta:norm([loc.country,loc.block,loc.assetType].join(' '))});
  });
}

function rank(r,q){
  if(r.title===q)return 0;
  if(r.title.startsWith(q))return 1;
  if(r.aliases.some(function(a){return a===q||a.startsWith(q)})||norm(r.loc.slug).startsWith(q)||norm(r.loc.routeSlug).startsWith(q))return 2;
  if(r.field.startsWith(q))return 3;
  if(r.meta.startsWith(q))return 4;
  if(r.text.indexOf(q)>=0)return 5;
  return 99;
}

function search(q){q=norm(q);if(q.length<2)return[];return searchIndex.map(function(r){return{r:r,rank:rank(r,q)}}).filter(function(x){return x.rank<99}).sort(function(a,b){return a.rank-b.rank||String(a.r.loc.title||'').localeCompare(String(b.r.loc.title||''))}).slice(0,12).map(function(x){return x.r})}

function renderSuggestions(list){
  var box=document.getElementById('platformSuggestions');
  currentSuggestions=list;activeSuggestionIndex=-1;
  if(!list.length){box.hidden=true;return}
  box.innerHTML=list.map(function(r,i){return'<div class="suggestion" data-i="'+i+'"><div class="suggestion-title">'+esc(r.loc.title)+'</div><div class="suggestion-meta">'+esc([r.loc.country,r.loc.block].filter(Boolean).join(' — '))+'</div></div>'}).join('');
  box.hidden=false;box.querySelectorAll('.suggestion').forEach(function(el){el.onclick=function(){selectPlatform(list[Number(el.dataset.i)])}});
}

function setStatus(s){var el=document.getElementById('platformSearchStatus');if(el)el.textContent=s||''}
function closeSuggestions(){document.getElementById('platformSuggestions').hidden=true;activeSuggestionIndex=-1}

function selectPlatform(result){
  var marker=result&&markerByKey[result.key];if(!marker)return;
  closeSuggestions();
  document.getElementById('platformSearch').value=marker.rigData.title||'';
  var pos=marker.getPosition();map.panTo(pos);map.setZoom(window.innerWidth<=768?8:9);
  openMarker(marker);
  marker.setAnimation(google.maps.Animation.BOUNCE);
  setTimeout(function(){marker.setAnimation(null)},1200);
  setStatus('Selected '+(marker.rigData.title||'platform'));
}

function wireSearch(){
  if(searchWired)return;
  searchWired=true;
  var input=document.getElementById('platformSearch'),btn=document.getElementById('platformSearchButton');
  input.oninput=function(){
    var list=search(input.value);
    renderSuggestions(list);
    setStatus(list.length?list.length+' match'+(list.length===1?'':'es'):(norm(input.value).length>=2?'No platform found. Try another name or field.':''));
  };
  btn.onclick=function(){
    var list=search(input.value);
    if(list[0])selectPlatform(list[0]);else setStatus('No platform found. Try another name or field.');
  };
  input.onkeydown=function(e){
    if(e.key==='Escape'){closeSuggestions();return}
    if(e.key==='Enter'){e.preventDefault()
      if(currentSuggestions[activeSuggestionIndex])selectPlatform(currentSuggestions[activeSuggestionIndex]);
      else if(currentSuggestions[0])selectPlatform(currentSuggestions[0]);return
    }
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();if(!currentSuggestions.length)return;
      activeSuggestionIndex=(activeSuggestionIndex+(e.key==='ArrowDown'?1:-1)+currentSuggestions.length)%currentSuggestions.length;
      document.querySelectorAll('.suggestion').forEach(function(el,i){el.classList.toggle('active',i===activeSuggestionIndex)});
    }
  };
}

function clearMap(){
  markers.forEach(function(marker){try{marker.setMap(null)}catch(e){}});
  overlays.forEach(function(overlay){try{overlay.setMap(null)}catch(e){}});
  markers=[];overlays=[];markerByKey={};searchIndex=[];
}

function normalizeLocation(p){
  var lat=parseFloat(p.latitude||p.lat),lng=parseFloat(p.longitude||p.lng);
  if(!isFinite(lat)||!isFinite(lng))return null;
  var slug=String(p.routeSlug||p.slug||'').toLowerCase();
  return {
    title:p.n||p.name||p.title||slug,
    operator:p.op||p.operator||'',
    image:p.img||p.photo||p.image||p.imageUrl||p.platformImage||p.assetImage||'',
    layout:p.ly||p.layout||'',
    lat:lat,
    lng:lng,
    country:p.c||p.country||'',
    block:p.b||p.block||p.blockLocation||'',
    field:p.field||'',
    fieldGroup:p.fg||p.fieldGroup||p.newsGroup||'',
    assetType:p.t||p.assetType||p.type||'',
    status:p.status||p.currentStatus||'',
    slug:p.slug||'',
    routeSlug:p.routeSlug||slug,
    aliases:p.a||p.aliases||[],
    similar:p.similar||[],
    link:p.url||('https://bookbitemedia.wixsite.com/rigoil-zac/blank-3?slug='+encodeURIComponent(slug))
  };
}

function normalizeLocations(payload){
  var arr=(payload&&payload.locations)||(payload&&payload.platforms)||(payload&&payload.data)||payload||[];
  if(!Array.isArray(arr))return[];
  return arr.map(normalizeLocation).filter(Boolean);
}

function mapSignature(locations){return locations.length+'|'+locations.map(function(loc){return keyFor(loc)+':'+loc.lat+','+loc.lng}).sort().join('|')}

function initMap(locations){
  locations=normalizeLocations(locations);
  if(!locations||!locations.length)return;
  var sig=mapSignature(locations);
  if(map&&markers.length&&sig===lastMapSignature)return;
  lastMapSignature=sig;
  var isMobile=innerWidth<=768;
  if(!map){
    map=new google.maps.Map(document.getElementById('map'),{center:{lat:57.64,lng:-0.23},zoom:6,styles:grayStyle,gestureHandling:'greedy',mapTypeControl:!isMobile,fullscreenControl:!isMobile,streetViewControl:false});
    infoWindow=new google.maps.InfoWindow();
  }else{
    clearMap();
  }
  window.rigoilMapLocations=locations;
  locations.forEach(function(loc){
    var marker=new google.maps.Marker({position:{lat:loc.lat,lng:loc.lng},map:map,title:loc.title,icon:{url:'https://static.wixstatic.com/media/85fa72_74509ba04324434aa892edbce9e73228~mv2.png',scaledSize:new google.maps.Size(32,32)},animation:google.maps.Animation.DROP});
    marker.rigData=loc;markers.push(marker);
    marker.addListener('click',function(){openMarker(marker)});
    var labelDiv=document.createElement('div');labelDiv.className='marker-label';labelDiv.innerText=loc.title;
    var overlay=new google.maps.OverlayView();
    overlay.onAdd=function(){this.getPanes().overlayMouseTarget.appendChild(labelDiv)};
    overlay.draw=function(){var p=this.getProjection().fromLatLngToDivPixel(marker.getPosition());if(p){labelDiv.style.left=p.x+'px';labelDiv.style.top=p.y+'px'}};
    overlay.onRemove=function(){if(labelDiv.parentNode)labelDiv.parentNode.removeChild(labelDiv)};
    overlay.setMap(map);overlays.push(overlay);
  });
  buildSearch(locations);wireSearch();
  setStatus(locations.length+' platforms loaded. Search by name, field, country or block.');
}

function loadStaticMapData(){
  fetch(MAP_DATA_URL,{cache:'default'})
    .then(function(r){return r.json()})
    .then(function(j){initMap(j)})
    .catch(function(e){setStatus('Map data failed to load');console.warn('RigOil static map data load failed',e)});
}

function doZoomTo(lat,lng){
  if(!map||!Number.isFinite(lat)||!Number.isFinite(lng))return;
  var pos=new google.maps.LatLng(lat,lng);map.panTo(pos);map.setZoom(9);
  var targetMarker=markers.find(function(m){return Math.abs(m.getPosition().lat()-lat)<1e-9&&Math.abs(m.getPosition().lng()-lng)<1e-9});
  if(targetMarker)openMarker(targetMarker);
}

window.onmessage=function(event){
  if(event.data&&(event.data.locations||event.data.platforms||event.data.data))initMap(event.data);
  if(event.data&&event.data.type==='zoomTo')doZoomTo(Number(event.data.lat),Number(event.data.lng));
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadStaticMapData);else loadStaticMapData();
</script>
</body>
</html>
